<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo</title>
  <link rel="icon" href="../img/PARAICONO.ico">
  <link rel="stylesheet" href="../static/EstiloCSS/catalogo.css">
</head>

<body>
  <header>
    <nav>
      <a href="../templates/index.html">Inicio</a>
      <a href="../templates/producto.html">Agregar Productos</a>
    </nav>
  </header>

   <main>
    <h1 class="titulo-catalogo">Nuestro Catálogo</h1>
    <div id="contenedor-productos" class="contenedor-productos">
      <!-- Se Colocan los productos aca -->
    </div>
  </main>

  <footer id="Contacto">
    <h2>Envianos tu consulta</h2>
    <form action="link" method="post" id="formulario-consulta">
      <div>
        <label for="Nombre">Nombre</label>
        <input type="text" name="Nombre" id="Nombre">
        <span class="error-message" id="nombre-error"></span>
      </div>
      <div>
        <label for="Apellido">Apellido</label>
        <input type="text" name="Apellido" id="Apellido">
        <span class="error-message" id="apellido-error"></span>
      </div>
      <div>
        <label for="Telefono">Telefono</label>
        <input type="number" name="Telefono" id="Telefono">
        <span class="error-message" id="telefono-error"></span>
      </div>
      <div>
        <label for="Mail">Mail</label>
        <input type="email" name="Mail" id="Mail">
        <span class="error-message" id="mail-error"></span>
      </div>
      <div>
        <label for="Consulta">Consulta:</label>
        <textarea name="Consulta" id="Consulta" rows="5" cols="30">Deja tu consulta aqui</textarea>
        <span class="error-message" id="consulta-error"></span>
      </div>
      <div>
        <input type="submit" value="Enviar" id="Boton-Enviar">
      </div>

      <div id="success-message" class="success-message"></div>
    </form>



  </footer>
  <script src="../pag_JavaScript/Catalogo.js"></script>
</body>

</html>
